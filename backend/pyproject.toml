[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steelshield-backend"
version = "0.1.0"
description = "Offline-first policy evaluator for synthetic agent-policy scenarios"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openpyxl>=3.1,<4.0",
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "redis>=5.0,<6.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "fakeredis[lua]>=2.23,<3.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
